name: Build PocketCanvas APK

on:
  push:
    branches:
      - arena/a10e9906-ai-anime3
    paths:
      - "pocketcanvas/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pocketcanvas-apk.yml"
  pull_request:
    paths:
      - "pocketcanvas/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pocketcanvas-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketcanvas-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble PocketCanvas debug APK
        run: gradle :pocketcanvas:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketCanvas-debug-apk
          path: pocketcanvas/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
