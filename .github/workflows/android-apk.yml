name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug > gradle-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 100 gradle-build.log
            summary=$(grep -E '^e: |^FAILURE:|^\* What went wrong:|^> ' gradle-build.log | tail -n 12 | paste -sd ' | ' -)
            summary=${summary//%/%25}
            summary=${summary//$'\r'/%0D}
            summary=${summary//$'\n'/%0A}
            echo "::error title=Gradle build failed::$summary"
            exit "$result"
          fi
          cat gradle-build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: localpilot-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
