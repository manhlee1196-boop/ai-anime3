name: Android APK

# Build file APK để cài lên điện thoại Android.
# Tự chạy khi push lên nhánh arena/** (và main), khi push tag v*; hoặc bấm tay ở
# tab Actions → "Run workflow" (nút này chỉ hiện khi workflow đã có trên nhánh main).
# APK là vỏ Capacitor bọc chính mobile/app — không có bản sao thứ hai của giao diện.
on:
  workflow_dispatch:
    inputs:
      min_count:
        description: "Ngưỡng post_count tối thiểu cho dữ liệu tag (mặc định 200)"
        required: false
        default: "200"
  push:
    branches:
      - "arena/**"      # push lên nhánh làm việc là build luôn, không cần chờ merge
      - "main"
    # chỉ build khi app/workflow đổi, để push tài liệu (colab/, *.md ở gốc) không tốn CI
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sinh dữ liệu tag cho app (95.939 tag · ~1,4 MB gz)
        run: |
          python3 mobile/build_data.py --min-count "${{ inputs.min_count || '200' }}"
          python3 mobile/build_data.py --check

      - name: Kiểm thử logic app và API Forge (Node, không cần GPU)
        run: |
          node mobile/tests/test_core.mjs
          node mobile/tests/test_api.mjs

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 17 (Capacitor 6 + Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bảo đảm có Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
            [ -n "$SDKMANAGER" ] || SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Cài Capacitor
        working-directory: mobile/apk
        run: npm install --no-audit --no-fund

      - name: Tạo project Android và chép app vào assets
        working-directory: mobile/apk
        run: |
          npx cap add android
          npx cap sync android
          bash native/install.sh
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/data/tags.json
          # AAPT coi *.gz là "bản nén của file cùng tên" nên tags.json.gz + tags.json bị
          # báo "Duplicate resources". APK tự nén zip rồi, nên bỏ bản .gz ở đây.
          rm -f android/app/src/main/assets/public/data/tags.json.gz
          ls -la android/app/src/main/assets/public/data

      - name: Ghi đường dẫn SDK cho Gradle
        working-directory: mobile/apk/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Cấu hình tải Gradle wrapper
        working-directory: mobile/apk/android
        run: |
          # Bản bin nhỏ hơn all; host trực tiếp tránh redirect GitHub Releases (504).
          sed -i -E 's|^distributionUrl=.*|distributionUrl=https://downloads.gradle.org/distributions/gradle-8.2.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/^networkTimeout=.*/networkTimeout=60000/' gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=https://downloads.gradle.org/distributions/gradle-8.2.1-bin.zip$' gradle/wrapper/gradle-wrapper.properties
          grep '^networkTimeout=60000$' gradle/wrapper/gradle-wrapper.properties

      - name: Tải Gradle distribution có retry
        working-directory: mobile/apk/android
        run: |
          # Wrapper Java không retry HTTP 504. Tải trước bằng curl, kiểm ZIP rồi dùng file local.
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            https://services.gradle.org/distributions/gradle-8.2.1-bin.zip \
            -o /tmp/gradle-8.2.1-bin.zip
          unzip -t /tmp/gradle-8.2.1-bin.zip >/dev/null
          test "$(stat -c %s /tmp/gradle-8.2.1-bin.zip)" -gt 50000000
          sed -i -E 's|^distributionUrl=.*|distributionUrl=file:///tmp/gradle-8.2.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=file:///tmp/gradle-8.2.1-bin.zip$' gradle/wrapper/gradle-wrapper.properties

      - name: Build APK (debug — ký sẵn bằng keystore debug, cài được ngay)
        working-directory: mobile/apk/android
        run: |
          chmod +x gradlew
          set -o pipefail
          {
            ./gradlew --version 2>&1 | head -20
            echo "--- @capacitor packages"
            ls ../node_modules/@capacitor 2>/dev/null
            node -e "console.log('capacitor core', require('../node_modules/@capacitor/core/package.json').version)" 2>/dev/null || true
            node -e "console.log('capacitor android', require('../node_modules/@capacitor/android/package.json').version)" 2>/dev/null || true
            echo "--- bắt đầu assembleDebug"
            ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee /tmp/gradle.log

      # Log của GitHub Actions cần đăng nhập mới xem được. Khi build lỗi, đẩy 300 dòng
      # cuối + thông tin môi trường lên chính nhánh này để đọc lại bằng git.
      - name: Ghi log lỗi lên nhánh (khi build fail)
        if: failure()
        run: |
          {
            echo "# Gradle build lỗi — $(date -u +%FT%TZ)"
            echo
            echo "## 300 dòng cuối"
            echo '```'
            tail -n 300 /tmp/gradle.log 2>/dev/null || echo "không có /tmp/gradle.log"
            echo '```'
            echo "## Môi trường"
            echo '```'
            java -version 2>&1 | head -3
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || true
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
            cat mobile/apk/android/local.properties 2>/dev/null || true
            echo "--- variables.gradle"
            sed -n '1,40p' mobile/apk/android/variables.gradle 2>/dev/null || true
            echo "--- gradle wrapper"
            cat mobile/apk/android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
            echo "--- capacitor settings"
            cat mobile/apk/android/capacitor.settings.gradle 2>/dev/null || true
            echo '```'
          } > ci-last-build.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-last-build.md
          git commit -m "CI: log Gradle lần build lỗi [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Đặt tên file APK
        run: |
          cp mobile/apk/android/app/build/outputs/apk/debug/app-debug.apk anime3-mobile.apk
          ls -lh anime3-mobile.apk

      - name: Lưu APK vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anime3-mobile-apk
          path: anime3-mobile.apk
          if-no-files-found: error
          retention-days: 90

      - name: Gắn APK vào Release (chỉ khi push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: anime3-mobile.apk
          body: |
            APK Anime3 cho Android — cài xong mở app, bấm ⚙ và dán link Forge
            (gradio.live / trycloudflare) là dùng được.
